[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-module"
version = "0.1.0"
description = "Motor de conocimiento de la plataforma EMPRESAS-IA (Capa 1) — fichas, conexiones y espacio semántico, genérico por instancia."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# Dependencias del NÚCLEO genérico. `sentence-transformers` NO está acá: solo lo necesita el
# proveedor de embeddings local (dev). Las instancias que usan el servicio BGE-m3 remoto no
# tienen por qué instalarse torch — ver el extra [local-embeddings].
dependencies = [
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Embeddings locales en CPU (sentence-transformers arrastra torch: ~2 GB).
local-embeddings = ["sentence-transformers>=3.0.0"]
# Cosecha de repositorios OAI-PMH y descarga/extracción de PDFs.
ingesta = ["requests>=2.31.0", "pypdf>=6.0.0"]
# Detección de huecos (requiere reducir dimensión antes de que "vacío" tenga sentido).
# `detectar_clusters` NO necesita este extra — funciona directo sobre el embedding crudo.
espacio = ["umap-learn>=0.5.6", "scipy>=1.13.0"]
# Servidor HTTP opcional para exponer datos del KM a un consumidor externo (ej. un visor).
servidor = ["fastapi>=0.110.0", "uvicorn>=0.29.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
knowledge_module = ["plantillas/*.yaml"]
